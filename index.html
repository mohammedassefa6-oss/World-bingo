 <!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beteseb Bingo</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white;text-align:center}
.container{max-width:500px;margin:auto;padding:18px}
h1{color:#4ade80;margin:5px 0}
.subtitle{color:#cbd5e1;margin-bottom:18px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}
.box{background:#1e293b;padding:10px 3px;border-radius:10px;font-size:13px}
.box strong{display:block;font-size:17px;color:#4ade80;margin-top:5px}
.current{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:14px}
#currentNumber{font-size:40px;font-weight:bold;color:#facc15;margin-top:5px}
.bingo-title{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:5px}
.bingo-title div{font-size:22px;font-weight:bold;color:#4ade80}
.card{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#334155;border-radius:8px;font-size:17px;font-weight:bold}
.cell.marked{background:#16a34a;color:white}
.free{background:#2563eb;font-size:13px}
.stake-grid{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.cartela-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:14px}
.cartela-cell{padding:8px 0;border-radius:6px;background:#334155;font-size:13px;font-weight:bold;cursor:pointer;border:none;color:white}
.cartela-cell:disabled{background:#1e293b;color:#475569;cursor:not-allowed}
button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:14px;font-size:17px;font-weight:bold;cursor:pointer}
.stake-btn{background:#22c55e;color:#052e16}
#bingoBtn{background:#facc15;color:#422006}
#status{margin-top:14px;color:#94a3b8;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <h1>🎱 Beteseb Bingo</h1>
  <div class="subtitle">Telegram Bingo Web App</div>

  <div class="info">
    <div class="box">💰 Balance<strong id="balance">-</strong></div>
    <div class="box">🎫 Room<strong id="roomLabel">-</strong></div>
    <div class="box">👥 Players<strong id="players">-</strong></div>
  </div>

  <div id="stakeScreen" class="stake-grid">
    <button class="stake-btn" data-stake="10">Play 10</button>
    <button class="stake-btn" data-stake="20">Play 20</button>
    <button class="stake-btn" data-stake="50">Play 50</button>
    <button class="stake-btn" data-stake="100">Play 100</button>
  </div>

  <div id="cartelaScreen" class="hidden">
    <div>Pick your cartela number:</div>
    <div id="cartelaGrid" class="cartela-grid"></div>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="current">
      <div>የተጠራው ቁጥር</div>
      <div id="currentNumber">-</div>
    </div>
    <div class="bingo-title"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
    <div id="card" class="card"></div>
    <button id="bingoBtn">🏆 BINGO!</button>
  </div>

  <div id="status">Connecting...</div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
window.addEventListener('error', function(e) {
  document.getElementById('status').textContent = '❌ JS Error: ' + e.message;
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getDatabase, ref, get, onValue, off } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDO1Zorz2jicim-u5g9MN-COe_pVCpVYI",
  authDomain: "world-bingo-2.firebaseapp.com",
  databaseURL: "https://world-bingo-2-default-rtdb.firebaseio.com",
  projectId: "world-bingo-2",
  storageBucket: "world-bingo-2.firebasestorage.app",
  messagingSenderId: "671762364377",
  appId: "1:671762364377:web:0408268bb13428a04bcbc8",
  measurementId: "G-B1WXVZ4JBE",
};

const SERVER_URL = "https://world-bingo-server.onrender.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

async function callServer(path, body) {
  const headers = { "Content-Type": "application/json" };
  if (auth.currentUser) {
    headers["Authorization"] = "Bearer " + (await auth.currentUser.getIdToken());
  }
  const resp = await fetch(SERVER_URL + path, {
    method: "POST",
    headers,
    body: JSON.stringify(body || {}),
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || "Request failed");
  return data;
}

const tg = window.Telegram.WebApp;
tg.expand();

const statusEl = document.getElementById("status");
const balanceEl = document.getElementById("balance");
const roomLabelEl = document.getElementById("roomLabel");
const playersEl = document.getElementById("players");

let currentUid = null;
let currentRoomId = null;
let currentCard = null;
let currentCalled = new Set();
let roomListenerRef = null;

function setStatus(text) { statusEl.textContent = text; }

async function login() {
  if (!tg.initData) {
    setStatus("⚠️ Open this from Telegram (no initData found).");
    return;
  }
  setStatus("Verifying Telegram login...");
  const data = await callServer("/verify-telegram-login", { initData: tg.initData });
  const cred = await signInWithCustomToken(auth, data.customToken);
  currentUid = cred.user.uid;
  setStatus("✅ Connected");
  listenBalance();
}

function listenBalance() {
  const balRef = ref(db, `users/${currentUid}/balance`);
  onValue(balRef, (snap) => {
    balanceEl.textContent = (snap.val() ?? 0) + " ETB";
  });
}

function showScreen(id) {
  for (const s of ["stakeScreen", "cartelaScreen", "gameScreen"]) {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  }
}

document.querySelectorAll(".stake-btn").forEach((btn) => {
  btn.addEventListener("click", () => openCartelaPicker(Number(btn.dataset.stake)));
});

async function openCartelaPicker(stake) {
  const roomId = `stake_${stake}_open`;
  const snap = await get(ref(db, `rooms/${roomId}/taken`));
  const taken = snap.exists() ? snap.val() : {};

  const grid = document.getElementById("cartelaGrid");
  grid.innerHTML = "";
  for (let n = 1; n <= 100; n++) {
    const b = document.createElement("button");
    b.className = "cartela-cell";
    b.textContent = n;
    if (taken[n]) b.disabled = true;
    b.onclick = () => pickCartela(stake, n);
    grid.appendChild(b);
  }
  showScreen("cartelaScreen");
}

async function pickCartela(stake, cartelaNumber) {
  setStatus("Joining room...");
  try {
    const data = await callServer("/join-room", { stake, cartelaNumber });
    currentRoomId = data.roomId;
    currentCard = data.yourCard;
    playersEl.textContent = data.playerCount;
    roomLabelEl.textContent = currentRoomId;
    renderCard();
    listenRoom(currentRoomId);
    showScreen("gameScreen");
    setStatus("Waiting for game to start...");
  } catch (e) {
    setStatus("⚠️ " + (e.message || "Could not join room"));
  }
}

function renderCard() {
  const cardEl = document.getElementById("card");
  cardEl.innerHTML = "";
  const cols = ["B", "I", "N", "G", "O"];
  for (let r = 0; r < 5; r++) {
    for (const col of cols) {
      const val = currentCard[col][r];
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = val;
      if (val === "FREE") {
        cell.classList.add("free", "marked");
      } else if (currentCalled.has(Number(val))) {
        cell.classList.add("marked");
      }
      cardEl.appendChild(cell);
    }
  }
}

function listenRoom(roomId) {
  if (roomListenerRef) off(roomListenerRef);
  roomListenerRef = ref(db, `rooms/${roomId}`);
  onValue(roomListenerRef, (snap) => {
    const room = snap.val();
    if (!room) return;
    currentCalled = new Set(Object.keys(room.calledNumbers || {}).map(Number));
    document.getElementById("currentNumber").textContent = room.lastCalled ?? "-";
    playersEl.textContent = Object.keys(room.players || {}).length;
    renderCard();

    if (room.state === "finished") {
      if (room.winner === currentUid) {
        setStatus(`🏆 You won ${room.prize ?? ""} ETB!`);
      } else if (room.winner) {
        setStatus("Someone else won this round.");
      } else {
        setStatus("Round ended.");
      }
    } else if (room.state === "running") {
      setStatus("Game in progress...");
    }
  });
}

document.getElementById("bingoBtn").addEventListener("click", async () => {
  if (!currentRoomId) return;
  setStatus("Checking your card...");
  try {
    const data = await callServer("/claim-bingo", { roomId: currentRoomId });
    setStatus(`🎉 BINGO confirmed! You won ${data.prize} ETB.`);
  } catch (e) {
    setStatus("Not a BINGO yet: " + (e.message || ""));
  }
});

login().catch((e) => {
  setStatus("❌ Login error: " + e.message);
  console.error(e);
});
</script>
</body>
</html>
